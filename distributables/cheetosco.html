<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>Cheetos Co. — An Audio Adventure</title>
<style>
:root{
  --bg:#0a0a0c;
  --fg:#f4f1e8;
  --accent:#ff7a00;     /* cheddar orange */
  --accent2:#ffb347;
  --danger:#ff4d4d;
  --ok:#6ee07a;
  --panel:#15151a;
  --line:#2a2a33;
  --muted:#9a9aa6;
  font-size: 18px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overscroll-behavior:none;}
body{
  background:radial-gradient(circle at 50% 30%, #1a1612 0%, #07070a 70%);
  color:var(--fg);
  font-family: "Trebuchet MS", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  overflow:hidden;
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* ---------- Tap gate ---------- */
.gate{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%, #241a0e, #050507 75%);
  cursor:pointer;
  touch-action:manipulation;
}
.gate-card{text-align:center;padding:2rem;max-width:520px;}
.gate-card h1{
  font-size: clamp(2.4rem, 9vw, 4.5rem);
  margin:0 0 .2rem; letter-spacing:.04em;
  background:linear-gradient(180deg,#ffd089,#ff7a00 60%,#c84a00);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(255,122,0,.25);
}
.tagline{color:var(--accent2);font-style:italic;margin:.2rem 0 1.6rem;font-size:1.1rem;}
.hint{color:var(--muted);line-height:1.5;}
.pulse{
  margin:2rem auto 0;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,122,0,.55), rgba(255,122,0,0) 70%);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.2);opacity:1}}

/* ---------- Stage ---------- */
.stage{position:fixed;inset:0;}
#radar{position:absolute;inset:0;width:100%;height:100%;opacity:.5;}
.caption{
  position:absolute;left:0;right:0;bottom:calc(38% + env(safe-area-inset-bottom));
  text-align:center;padding:0 1rem;
  font-size:clamp(1rem,2.6vw,1.4rem);
  color:var(--fg);text-shadow:0 2px 12px #000;
  letter-spacing:.02em;
}
.toast{
  position:absolute;top:calc(1rem + env(safe-area-inset-top));left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(20,16,10,.92);border:1px solid var(--accent);
  color:var(--accent2);padding:.6rem 1.1rem;border-radius:999px;
  font-weight:bold;opacity:0;transition:opacity .25s, transform .25s;
  pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Touch D-pad ---------- */
.touchpad{
  position:fixed;left:0;right:0;bottom:0;
  height:38%;
  display:none; /* shown only on touch devices via .touch body class */
  z-index:20;
}
body.touch .touchpad{display:block;}

.dpad{
  position:absolute;
  width:22vw;height:22vw;max-width:110px;max-height:110px;
  min-width:64px;min-height:64px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #2c2c36, #14141a);
  border:2px solid #3a3a46;
  color:var(--fg);font-size:1.4rem;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
}
.dpad:active{background:radial-gradient(circle at 35% 30%, #3a3a46, #1c1c24);}
.dpad.center{background:radial-gradient(circle at 35% 30%, #4a2c10, #2a1600);border-color:var(--accent);color:var(--accent2);}
.dpad.up{left:28%;bottom:14%;}
.dpad.down{left:28%;bottom:2%;}
.dpad.left{left:14%;bottom:8%;}
.dpad.right{left:42%;bottom:8%;}
.dpad.center{left:28%;bottom:8%;opacity:.0;} /* center is the interact button hidden under overlap? keep accessible */

.action{
  position:absolute;
  width:18vw;height:18vw;max-width:90px;max-height:90px;min-width:56px;min-height:56px;
  border-radius:50%;border:2px solid #3a3a46;
  font-size:1.2rem;font-weight:bold;color:var(--fg);
  background:radial-gradient(circle at 35% 30%, #2c2c36, #14141a);
  bottom:6%;
}
.action:active{transform:scale(.94);}
.action.a{right:18%;background:radial-gradient(circle at 35% 30%, #4a2c10, #2a1600);border-color:var(--accent);color:var(--accent2);}
.action.b{right:4%;bottom:16%;}
.action.m{right:4%;bottom:2%;}

/* ---------- Menus (visual overlay, also navigable by screen reader) ---------- */
.menu{
  position:fixed;inset:0;z-index:40;
  display:none;align-items:center;justify-content:center;
  background:rgba(5,5,8,.78);backdrop-filter:blur(3px);
  padding:1rem;
  touch-action:none;
}
.menu.open{display:flex;}
.menu-card{
  width:min(560px,94vw);
  max-height:86vh;overflow:auto;
  background:linear-gradient(180deg,#1b1b22,#101015);
  border:1px solid var(--line);border-radius:18px;
  padding:1.2rem 1rem;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.menu-title{
  margin:0 0 .8rem;text-align:center;font-size:1.6rem;
  color:var(--accent2);letter-spacing:.03em;
}
.menu-sub{text-align:center;color:var(--muted);margin:-.4rem 0 .9rem;font-size:.95rem;}
.mi{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  width:100%;text-align:left;
  padding:.95rem 1rem;margin:.25rem 0;border-radius:12px;
  background:#18181f;border:1px solid #262630;color:var(--fg);
  font-size:1.1rem;cursor:pointer;
}
.mi:focus,.mi.focused{outline:none;border-color:var(--accent);background:#211a12;box-shadow:0 0 0 3px rgba(255,122,0,.2);}
.mi .k{color:var(--muted);font-size:.85rem;}
.mi:disabled{opacity:.45;}
.menu-foot{margin-top:.8rem;text-align:center;color:var(--muted);font-size:.85rem;}
.divider{height:1px;background:var(--line);margin:.6rem .4rem;}
.bar{
  height:14px;border-radius:8px;background:#0c0c10;border:1px solid #2a2a33;overflow:hidden;margin:.3rem 0 .7rem;
}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:.2rem 0;}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:999px;background:#221a10;color:var(--accent2);font-size:.8rem;margin-left:.4rem;}

@media (prefers-reduced-motion: reduce){
  .pulse{animation:none;}
}

</style>
</head>
<body>
<!--
  ============================================================================
  CHEETOS CO. — A BLIND-ACCESSIBLE AUDIO GAME
  ============================================================================
  This game has no meaningful visuals. Everything is sound.
  The screen below is a tactile/visual reference + touch surface.

  Architecture (data driven, easy to expand):
    src/data/        <- items, recipes, rooms, npcs, dialogue, quests, menus
    src/audio/       <- procedural synth engine, positional 3D audio, speech
    src/core/        <- input, state, save, menus, event bus
    src/systems/     <- inventory, crafting, jobs, economy
    src/world/       <- movement, rooms, interactables
  To add content: edit data files. To add a sound: add an entry to sounds.js.
  ============================================================================
-->

<div id="app" role="application" aria-label="Cheetos Co audio game">

  <!-- The tap-to-start gate (required by browsers for audio) -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <h1>CHEETOS&nbsp;CO.</h1>
      <p class="tagline">An audio adventure in crunchy corporate life.</p>
      <p class="hint">Put on headphones. Tap anywhere, or press any key, to begin.</p>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Visual reference: what your ears are doing (purely decorative) -->
  <div id="stage" class="stage" aria-hidden="true">
    <canvas id="radar"></canvas>
    <div id="caption" class="caption"></div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- Live region for screen readers / quick announcements -->
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="live-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <!-- Touch controls (shown on touch devices; keyboard always works) -->
  <div id="touchpad" class="touchpad" aria-hidden="true">
    <button class="dpad up"    data-hold="up">▲</button>
    <button class="dpad left"  data-hold="left">◀</button>
    <button class="dpad center" data-tap="interact">●</button>
    <button class="dpad right" data-hold="right">▶</button>
    <button class="dpad down"  data-hold="down">▼</button>
    <button class="action a" data-tap="actionA">A</button>
    <button class="action b" data-tap="back">B</button>
    <button class="action m" data-tap="menu">☰</button>
  </div>

</div>

  function initQuests() {
    on(EVT.CRAFT_DONE, ({ recipe }) => advance({ type: "craft", recipeId: recipe.id, item: recipe.output.itemId }));
    on(EVT.SELL, ({ total }) => {
      advance({ type: "sell", value: total });
      advance({ type: "earn", value: total });
    });
    on(EVT.COLLECT, ({ id }) => advance({ type: "collect", item: id }));
    on(EVT.ENTER_ROOM, ({ room }) => advance({ type: "enter", room: room.id }));
    on(EVT.DIALOGUE, ({ npc }) => advance({ type: "talk", npc }));
    on(EVT.LEVEL, ({ level }) => advance({ type: "reach_level", level }));
    on(EVT.UPGRADE, () => advance({ type: "buy_upgrade", any: true }));
    on(EVT.CONTRACT, ({ type }) => {
      if (type === "complete") advance({ type: "contract" });
    });
    on(EVT.RESEARCH, ({ type }) => {
      if (type === "complete") advance({ type: "research" });
    });
    on(EVT.EMPLOYEE, ({ type }) => {
      if (type === "hire") advance({ type: "hire" });
    });
    on(EVT.MONEY, ({ delta }) => {
      if (delta > 0) advance({ type: "earn", value: delta });
    });
  }
  function startQuest(id) {
    const s = getState();
    if (s.quests.active || s.quests.completed.includes(id)) return;
    const q = QUESTS[id];
    if (!q) return;
    s.quests.active = id;
    s.quests.stepIndex = 0;
    s.quests.progress = {};
    setFlag("quest." + id, true);
    emit(EVT.QUEST, { type: "start", quest: q });
    say(`Quest started: ${q.title}. ${objectiveText(q, 0)}.`, { blip: "ding" });
    live(`Quest: ${q.title}`);
  }
  function objectiveKey(qi, oi) {
    return `${qi}.${oi}`;
  }
  function objectiveText(q, i) {
    const o = q.objectives[i];
    if (!o) return "";
    const label = o.label || describeObjective(o);
    const s = getState();
    const have = s.quests.progress[`${q.id}.${i}`] || 0;
    const need = o.count || o.value || o.level || 1;
    if (o.type === "reach_level") return `Objective: ${label} (level ${have}/${need})`;
    if (o.type === "sell") return `Objective: ${label} (${have}/${need} coins)`;
    return `Objective: ${label} (${have}/${need})`;
  }
  function describeObjective(o) {
    switch (o.type) {
      case "craft":
        return `Craft ${o.count} ${o.recipeId || o.item}`;
      case "sell":
        return `Earn ${o.value} in sales`;
      case "collect":
        return `Collect ${o.count} ${o.item}`;
      case "enter":
        return `Enter ${o.room}`;
      case "talk":
        return `Talk to ${o.npc}`;
      case "reach_level":
        return `Reach level ${o.level}`;
    }
  }
  function matches(obj, evt) {
    if (obj.type !== evt.type) return false;
    if (obj.recipeId && obj.recipeId !== evt.recipeId) return false;
    if (obj.item && obj.item !== evt.item) return false;
    if (obj.npc && obj.npc !== evt.npc) return false;
    if (obj.room && obj.room !== evt.room) return false;
    return true;
  }
  function amountFor(evt) {
    if (evt.value) return evt.value;
    if (evt.count) return evt.count;
    return 1;
  }
  function needFor(o) {
    return o.count || o.value || o.level || 1;
  }
  function advance(evt) {
    const s = getState();
    if (!s.quests.active) return;
    const q = QUESTS[s.quests.active];
    if (!q) return;
    const i = s.quests.stepIndex;
    const obj = q.objectives[i];
    if (!obj) return;
    if (!matches(obj, evt)) return;
    const key = objectiveKey(q.id, i);
    const cur = s.quests.progress[key] || 0;
    const nv = Math.max(cur, cur + amountFor(evt));
    s.quests.progress[key] = nv;
    if (nv >= needFor(obj)) {
      s.quests.stepIndex++;
      if (s.quests.stepIndex >= q.objectives.length) complete(q);
      else {
        say(objectiveText(q, s.quests.stepIndex), { blip: "focus" });
        emit(EVT.QUEST, { type: "objective", quest: q, index: s.quests.stepIndex });
      }
    } else {
      emit(EVT.QUEST, { type: "progress", quest: q, index: i, progress: nv, need: needFor(obj) });
    }
  }
  function complete(q) {
    const s = getState();
    s.quests.completed.push(q.id);
    s.quests.active = null;
    s.quests.stepIndex = 0;
    const r = q.rewards || {};
    if (r.money) addMoney(r.money);
    if (r.xp) addXp(r.xp);
    if (r.items) for (const [id, n] of Object.entries(r.items)) addItem(id, n);
    say(`Quest complete: ${q.title}!`, { blip: "levelup" });
    if (r.money || r.xp) {
      say(`Rewards: ${r.money ? r.money + " coins" : ""}${r.money && r.xp ? ", " : ""}${r.xp ? r.xp + " experience" : ""}.`, { blip: false });
    }
    if (q.ending) setTimeout(() => say(q.ending, { blip: "levelup" }), 1500);
    if (q.next) setTimeout(() => startQuest(q.next), q.ending ? 6e3 : 2500);
    emit(EVT.QUEST, { type: "complete", quest: q });
  }
  function questStatus() {
    const s = getState();
    if (!s.quests.active) return "No active quest.";
    const q = QUESTS[s.quests.active];
    return `${q.title}. ${objectiveText(q, s.quests.stepIndex)}`;
  }

  var timer = null;
  function availableResearch() {
    const s = getState();
    return Object.entries(RESEARCH).filter(([id, r]) => !s.research.done.includes(id) && r.level <= s.player.level).map(([id, r]) => ({ id, ...r }));
  }
  function startResearch(id) {
    const s = getState();
    const r = RESEARCH[id];
    if (!r) return false;
    if (s.research.current) {
      say("A project is already in progress.", { blip: "error" });
      return false;
    }
    if (s.player.level < r.level) {
      say(`Requires level ${r.level}.`, { blip: "error" });
      return false;
    }
    if (!spendMoney(r.cost)) {
      say("Not enough coins for research funding.", { blip: "error" });
      return false;
    }
    s.research.current = id;
    s.research.until = Date.now() + r.time * 1e3;
    say(`Research started: ${r.name}. Takes ${r.time} seconds.`, { blip: "beep_machine" });
    playSound(SOUNDS.beep_machine, { out: getSfxBus() });
    scheduleTick();
    emit(EVT.RESEARCH, { type: "start", id });
    return true;
  }
  function scheduleTick() {
    if (timer) clearTimeout(timer);
    const s = getState();
    if (!s.research.current) return;
    const left = Math.max(0, s.research.until - Date.now());
    timer = setTimeout(finishResearch, left + 50);
  }
  function researchProgress() {
    const s = getState();
    if (!s.research.current) return null;
    const r = RESEARCH[s.research.current];
    const total = r.time * 1e3;
    const left = Math.max(0, s.research.until - Date.now());
    return { id: s.research.current, ...r, left, progress: 1 - left / total };
  }
  function finishResearch() {
    const s = getState();
    const id = s.research.current;
    const r = RESEARCH[id];
    if (!r) return;
    s.research.done.push(id);
    s.research.current = null;
    s.research.until = 0;
    if (r.unlock.recipe) {
      const key = `${r.unlock.recipe.station}:${r.unlock.recipe.id}`;
      s.unlockedRecipes[key] = true;
    }
    if (r.unlock.upgrade) s.unlockedUpgrades[r.unlock.upgrade] = true;

    say(`Research complete: ${r.name} is now available!`, { blip: "levelup" });
    emit(EVT.RESEARCH, { type: "complete", id });
  }
  function initResearch() {

  function attemptAutoCraft(emp, empState) {

    if (!recipes.length) return;
    const r = recipes[Math.floor(Math.random() * recipes.length)];
    for (const [id, n] of Object.entries(r.inputs)) removeItem(id, n);
    const q = rollQuality({ skillBonus: employeeQuality(emp, empState.shifts || 0) - 50, minigame: 0 });

    emit(EVT.CRAFT_DONE, { recipe: r, quality: q.tier, score: q.score, count: r.output.count, byEmployee: true });

  // src/audio/position.js
  init_context();
  init_synth();
  var DIR = [
    { x: 1, y: 0 },
    // E
    { x: 0, y: 1 },
    // S
    { x: -1, y: 0 },
    // W
    { x: 0, y: -1 }
    // N
  ];
  function createPositionable() {
    const audio = ac();
    const input = audio.createGain();
    const dist = audio.createGain();
    const lp = audio.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 18e3;
    lp.Q.value = 0.7;
    let pan;
    if (audio.createStereoPanner) {
      pan = audio.createStereoPanner();
      input.connect(pan);
      pan.connect(dist);
    } else {
      const merger = audio.createChannelMerger(2);
      const left = audio.createGain();
      const right = audio.createGain();
      input.connect(left);
      input.connect(right);
      left.connect(merger, 0, 0);
      right.connect(merger, 0, 1);
      merger.connect(dist);
      pan = {
        _fallback: true,
        get pan() {
          return this._v;
        },
        set pan(v) {
          this._v = v;
          const p = Math.max(-1, Math.min(1, v));
          left.gain.value = Math.cos((p + 1) * Math.PI / 4);
          right.gain.value = Math.sin((p + 1) * Math.PI / 4);
        },
        _setPan(v) {
          this.pan = v;
        },
        _v: 0
      };
    }
    dist.connect(lp);
    lp.connect(getSfxBus());
    return { input, pan, dist, lp };
  }
  function updatePositionable(p, ex, ey, lx, ly, facing, opts = {}) {
    const dx = ex - lx, dy = ey - ly;
    const distEuclid = Math.hypot(dx, dy);
    const f = DIR[facing & 3];
    const rx = -f.y, ry = f.x;
    let side = dx * rx + dy * ry;
    const forward = dx * f.x + dy * f.y;
    let lateral = distEuclid > 1e-3 ? side / distEuclid : 0;
    lateral = Math.max(-1, Math.min(1, lateral));
    if (p.pan._setPan) p.pan._setPan(lateral);
    else p.pan.pan.value = lateral;
    const range = opts.range || 8;
    const norm = Math.min(1, distEuclid / range);
    let gain = 1 / (1 + norm * norm * 2.2);
    if (forward < -0.1) gain *= 0.7;
    p.dist.gain.value = gain * (opts.vol ?? 1);
    const occl = opts.occluded ? 0.35 : 1;
    const cutoff = 18e3 * (1 - norm * 0.75) * occl;
    p.lp.frequency.value = Math.max(350, cutoff);
  }
  function playAt(sound, ex, ey, listener, opts = {}) {
    if (!listener) return playSound(sound, { out: getSfxBus(), ...opts });
    const p = createPositionable();
    updatePositionable(p, ex, ey, listener.x, listener.y, listener.facing, opts);
    const h = playSound(sound, { ...opts, out: p.input });
    const dur = Math.max(...(Array.isArray(sound) ? sound : sound.voices || [sound]).map((v) => (v.delay || 0) + (typeof v.dur === "number" ? v.dur : v.dur?.max || 1)));
    setTimeout(() => {
      try {
        p.lp.disconnect();
        p.dist.disconnect();
      } catch (e) {
      }
    }, (dur + 0.3) * 1e3);
    return h;
  }
  var Beacon = class {
    constructor(sound, getPos, opts = {}) {
      this.sound = sound;
      this.getPos = getPos;
      this.opts = opts;
      this.enabled = opts.enabled !== false;
      this.interval = opts.interval ?? 2600;
      this.jitter = opts.jitter ?? 700;
      this.range = opts.range ?? 8;
      this.volume = opts.volume ?? 1;
      this.timer = null;
      this.pos = createPositionable();
    }
    start() {
      if (this.timer) return;
      const tick2 = () => {
        this.emit();
        const next = this.interval + (Math.random() * 2 - 1) * this.jitter;
        this.timer = setTimeout(tick2, Math.max(300, next));
      };
      this.timer = setTimeout(tick2, 500 + Math.random() * 600);
    }
    stop() {
      if (this.timer) {
        clearTimeout(this.timer);
        this.timer = null;
      }
      try {
        this.pos.lp.disconnect();
        this.pos.dist.disconnect();
      } catch (e) {
      }
    }
    update(listener) {
      const e = this.getPos();
      if (!e) return;
      updatePositionable(this.pos, e.x, e.y, listener.x, listener.y, listener.facing, { range: this.range, vol: this.volume, occluded: e.occluded });
    }
    emit() {
      if (!this.enabled) return;
      const e = this.getPos();
      if (!e) return;
      playSound(this.sound, { out: this.pos.input });
    }
  };

  function drawRadar() {
    if (!ctx2) return;
    const W = radar.width, H = radar.height;
    ctx2.clearRect(0, 0, W, H);
    const p = getPlayer();
    const scale = Math.min(W, H) / 18;
    const cx = W / 2, cy = H / 2;

      ctx2.stroke();
      ctx2.beginPath();
      ctx2.moveTo(0, cy + i * scale);
      ctx2.lineTo(W, cy + i * scale);
      ctx2.stroke();
    }
    Promise.resolve().then(() => (init_rooms(), rooms_exports)).then(({ ROOMS: ROOMS2 }) => {
      for (const r of ROOMS2) {
        const x = cx + (r.x - p.x) * scale;
        const y = cy + (r.y - p.y) * scale;
        ctx2.fillStyle = "rgba(255,170,80,0.07)";
        ctx2.strokeStyle = "rgba(255,170,80,0.35)";
        ctx2.fillRect(x, y, r.w * scale, r.h * scale);
        ctx2.strokeRect(x, y, r.w * scale, r.h * scale);
      }
      Promise.resolve().then(() => (init_rooms(), rooms_exports)).then(({ OBJECTS: OBJECTS2 }) => {
        for (const o of OBJECTS2) {
          const x = cx + (o.x - p.x) * scale + scale / 2;
          const y = cy + (o.y - p.y) * scale + scale / 2;
          ctx2.fillStyle = o.type === "station" ? "#ff7a00" : o.type === "npc" ? "#ffd089" : o.type === "container" ? "#6ee07a" : "#888";
          ctx2.beginPath();
          ctx2.arc(x, y, scale * 0.22, 0, Math.PI * 2);
          ctx2.fill();
        }
        ctx2.fillStyle = "#fff";
        ctx2.beginPath();
        ctx2.arc(cx, cy, scale * 0.3, 0, Math.PI * 2);
        ctx2.fill();
        const f = [[1, 0], [0, 1], [-1, 0], [0, -1]][p.facing];
        ctx2.strokeStyle = "#fff";
        ctx2.beginPath();
        ctx2.moveTo(cx, cy);
        ctx2.lineTo(cx + f[0] * scale * 1.2, cy + f[1] * scale * 1.2);
        ctx2.stroke();
      });
    });
  }

  function pickEvent(state2, rng = Math.random) {
    const eligible = EVENTS.filter((e) => (e.minLevel || 1) <= state2.player.level && (!e.condition || e.condition(state2)));
    if (!eligible.length) return null;
    const total = eligible.reduce((a, e) => a + (e.weight || 1), 0);
    let r = rng() * total;
    for (const e of eligible) {
      r -= e.weight || 1;
      if (r <= 0) return e;
    }
    return eligible[0];
  }

  function spawnBeacons() {
    beacons = beacons.filter((b) => {
      if (b._object) {
        b.stop();
        return false;
      }
      return true;
    });
    for (const obj of OBJECTS) {
      let sound = null, interval2 = 3e3, volume = 0.7;
      if (obj.type === "npc") {
        const def = NPCS[obj.npc] || {};
        sound = SOUNDS[def.cue] || SOUNDS.npc_chatter;
        interval2 = def.interval || 4e3;
      } else if (obj.type === "station") {
        sound = SOUNDS[obj.sound] || SOUNDS.machine_hum;
        interval2 = 2200;
        volume = 0.55;
      } else if (obj.type === "container") {
        sound = SOUNDS[obj.sound] || SOUNDS.pickup;
        interval2 = 5e3;
        volume = 0.4;
      } else if (obj.type === "shop") {
        sound = SOUNDS[obj.sound] || SOUNDS.coin;
        interval2 = 4500;
        volume = 0.4;
      }
      if (!sound) continue;
      const b = new Beacon(sound, () => obj, { interval: interval2, jitter: 1200, range: 7, volume });
      b._object = true;
      b.start();
      beacons.push(b);

    say(`You are in the ${room.name}. Nearby: ${desc}.`, { blip: "blip" });
    const p = getPlayer();
    nearby.slice(0, 4).forEach(({ o }, i) => setTimeout(() => playAt(SOUNDS.blip, o.x, o.y, { x: p.x, y: p.y, facing: p.facing }, { range: 8 }), i * 220));
  }
  function directionTo(o) {
    const p = getPlayer();
    const dx = o.x - p.x, dy = o.y - p.y;
    const f = [[1, 0], [0, 1], [-1, 0], [0, -1]][p.facing];
    const fx = dx * f[0] + dy * f[1];
    const rx = dx * -f[1] + dy * f[0];
    let a = Math.atan2(rx, fx);
    if (a < 0) a += Math.PI * 2;
    const idx = Math.round(a / (Math.PI * 2) * 8) % 8;
    return ["ahead", "ahead-right", "right", "behind-right", "behind", "behind-left", "left", "ahead-left"][idx];
  }
  function back2() {
    if (isMenuOpen()) {
      closeTop();
      return;
    }
    if (isInDialogue()) {
      endDialogue();
      return;
    }
    openStatus();
  }
  function openStatus() {
    if (!isMenuOpen()) statusMenu();
    else closeTop();
  }
  function openInventory() {
    if (!isMenuOpen()) inventoryMenu();
    else closeTop();
  }
  on(EVT.ENTER_ROOM, ({ room }) => {
    if (room?.track && TRACKS[room.track]) startTrack(TRACKS[room.track]);
    say(room.description, { blip: "door_open" });
    checkAchievements();
  });
  on(EVT.CRAFT_DONE, () => {
    saveGame();
    checkAchievements();
  });
  on(EVT.SELL, () => {
    saveGame();
    checkAchievements();
  });
  on(EVT.LEVEL, () => checkAchievements());
  on(EVT.QUEST, () => checkAchievements());
  on(EVT.MOVE, () => checkAchievements());

  // src/systems/audio-test.js
  init_sounds();
  init_synth();
  init_context();
  init_speech();
  var delay = (ms) => new Promise((r) => setTimeout(r, ms));
  async function testSpeakers() {
    playSound(SOUNDS.test_left, { out: getSfxBus() });
    await delay(600);
    say("Left", { blip: false });
    await delay(900);
    playSound(SOUNDS.test_center, { out: getSfxBus() });
    await delay(600);
    say("Center", { blip: false });
    await delay(900);
    playSound(SOUNDS.test_right, { out: getSfxBus() });
    await delay(600);
    say("Right", { blip: false });
    await delay(1200);
  }

  // src/main.js
  var booted = false;
  async function boot() {
    if (booted) return;
    booted = true;
    await initAudio();
    initInput();
    initMenus();
    applySettings(getState().settings);
    hideGate();
    setTimeout(mainMenu, 300);
  }
  function hideGate() {
    const g = document.getElementById("gate");
    if (g) {
      g.style.transition = "opacity .6s";
      g.style.opacity = "0";
      setTimeout(() => g.remove(), 700);
    }
  }
  function applySettings(s) {
    setMasterVolume(s.masterVol ?? 0.9);
    setSpeechVolume(s.speechVol ?? 1);
    const m = getMusicBus();
    if (m) m.gain.value = s.musicVol ?? 0.55;
    const sx = getSfxBus();
    if (sx) sx.gain.value = s.sfxVol ?? 1;
    configureSpeech({ rate: s.speechRate ?? 1, pitch: s.speechPitch ?? 1, voiceURI: s.speechVoice ?? null });
    setPreBlip(s.preBlip !== false);
  }
  function mainMenu() {
    clearActions();
    stopTrack();
    closeAll();
    cancelSpeech();
    const canLoad = hasSave();
    const items = [
      { label: "\u25B6  Start New Game", onSelect: () => {
        replaceState(newGame());
        startGame();
      } },
      {
        label: "\u21BB  Continue / Load Game",
        disabled: !canLoad,
        k: canLoad ? "" : "no save",
        onSelect: () => {
          if (loadGame()) startGame();
          else say("No save found.", { blip: "error" });
        }
      },
      { label: "\u{1F50A}  Test Speakers", onSelect: () => testSpeakers().then(mainMenu) },
      { label: "\u2699  Settings", onSelect: () => settingsMenu(mainMenu) },
      { label: "\u2753  How to Play", onSelect: howToPlay }
    ];
    openMenu({
      title: "CHEETOS CO.",
      subtitle: "An audio adventure",
      items,
      noSound: true
    });
    startTrack(TRACKS.lobby);
    say("Welcome to Cheetos Company. Main menu. Use arrow keys to browse and Enter to select. On touch, tap an option.", { blip: "blip" });
  }
  function howToPlay() {
    openMenu({
      title: "How to Play",
      subtitle: "Put on headphones for stereo sound",
      items: [
        { label: "Move: Arrow keys or WASD. On touch, use the D-pad or swipe." },
        { label: "Interact: E, Enter, Space, or double-tap the screen." },
        { label: "Scan room: Hold Shift or press Tab to hear nearby objects." },
        { label: "Back / cancel: Escape or K." },
        { label: "Menu / status: M or the menu button. Inventory: I." },
        { label: "Sounds come from the direction of their source. Turn to face them!" },
        { label: "Walk into a station to craft. Walk into a person to talk. Face crates to loot." },
        { label: "Your progress saves automatically every 15 seconds." },
        { label: "\u2190 Back", onSelect: mainMenu }
      ]
    });
  }
  var gate = document.getElementById("gate");
  var booting = false;
  var booted_ok = false;
  async function kick(e) {
    if (booting || booted_ok) return;
    booting = true;
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    try {
      await boot();
      booted_ok = true;
      document.removeEventListener("touchstart", kick);
      document.removeEventListener("click", kick);
      window.removeEventListener("keydown", kick);
    } catch (err) {
      console.error("Boot failed:", err);
      booting = false;
      if (gate) {
        gate.innerHTML = '<div class="gate-card"><h1>ERROR</h1><p class="hint">' + (err.message || "Something went wrong") + '</p><p class="hint">Tap to retry</p></div>';
      }
    }
  }
  document.addEventListener("touchstart", kick, { passive: false });
  document.addEventListener("click", kick);
  window.addEventListener("keydown", kick);
})();

</script>
</body>
</html>
