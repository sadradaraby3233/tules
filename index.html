<style>

  html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:monospace;overflow:hidden;touch-action:none;user-select:none}
  #overlay{position:fixed;inset:0;background:radial-gradient(circle at center,#ff8c00 0%,#1a0a00 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer}

  #overlay p{margin-top:2rem;font-size:1.2rem;background:#000a;padding:1rem 2rem;border-radius:1rem;border:2px solid var(--cheeto-orange)}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
  #game-root{display:flex;flex-direction:column;height:100%;width:100%}
  #top-bar{display:flex;justify-content:space-between;padding:0.5rem 1rem;background:#1a1200;border-bottom:2px solid var(--cheeto-orange);font-size:0.9rem}
  #log{flex:1;overflow:auto;padding:1rem;white-space:pre-wrap;line-height:1.5;font-size:1rem;background:#0f0b00}
  #log .sys{color:#ffaa33}
  #log .room{color:#fff;font-weight:bold;font-size:1.2rem}
  #log .speak{color:#aaffff}
  #touch-controls{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6px;padding:6px;background:#1a1200;height:42vh;max-height:360px}
  #touch-controls button{background:#2a1a00;border:2px solid var(--cheeto-orange);color:var(--text);font-size:1.1rem;border-radius:12px;touch-action:manipulation}
  #touch-controls button:active{background:var(--cheeto-orange);color:#000}
  #touch-up{grid-column:2;grid-row:1}
  #touch-left{grid-column:1;grid-row:2}
  #touch-center{grid-column:2;grid-row:2;background:#ff8c00 !important;color:#000 !important;font-weight:bold}
  #touch-right{grid-column:3;grid-row:2}
  #touch-down{grid-column:2;grid-row:3}
  #bottom-bar{display:flex;gap:6px;padding:6px;background:#000}
  #bottom-bar button{flex:1;padding:0.8rem;background:#222;border:1px solid #555;color:#fff;border-radius:8px;font-size:0.9rem}
  #bottom-bar button:focus{outline:3px solid var(--cheeto-orange)}
  #menu-overlay{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:50}
  #menu-box{background:#1a1200;border:3px solid var(--cheeto-orange);border-radius:16px;padding:1.5rem;min-width:300px;max-width:90vw;max-height:90vh;overflow:auto}
  #menu-box h2{color:var(--cheeto-orange);margin-bottom:1rem;text-align:center}
  .menu-item{padding:0.9rem 1rem;margin:0.4rem 0;background:#2a1e00;border:2px solid transparent;border-radius:10px;cursor:pointer;font-size:1.1rem}
  .menu-item.selected{background:var(--cheeto-orange);color:#000;border-color:#fff;transform:scale(1.03)}
  .hidden{display:none !important}
  #aria-live{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
  #visualizer{height:6px;background:#000;position:relative;overflow:hidden}
  #visualizer-bar{height:100%;width:30%;background:linear-gradient(90deg,var(--cheeto-orange),var(--cheeto-red));position:absolute;animation:scan 2s linear infinite}
  @keyframes scan{0%{left:-30%}100%{left:100%}}
  kbd{background:#333;border:1px solid #666;border-bottom-width:3px;padding:2px 6px;border-radius:4px;font-size:0.85em}
</style>

// ============================================================================
// AUDIO ENGINE - 100% PROCEDURAL SYNTHESIS, 3D HRTF, SPEECH
// ============================================================================
class AudioEngine {
  constructor(){
    this.ctx=null;
    this.master=null;
    this.ambienceGain=null;
    this.sfxGain=null;
    this.speechGain=null;
    this.ambienceNodes=[];
    this.beaconNodes=[];
    this.listenerPos={x:0,y:0,angle:0};
    this.isInitialized=false;
    this.speechRate=1.0;
    this.use3D=true;
    this.noiseBuffers={};
    this.voice=null;
  }
  async init(){
    if(this.isInitialized) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
    this.master = this.ctx.createGain(); this.master.gain.value=0.9; this.master.connect(this.ctx.destination);
    this.ambienceGain = this.ctx.createGain(); this.ambienceGain.gain.value=0.25; this.ambienceGain.connect(this.master);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value=0.8; this.sfxGain.connect(this.master);
    this.speechGain = this.ctx.createGain(); this.speechGain.gain.value=1.0; this.speechGain.connect(this.master);
    if(this.ctx.listener && this.ctx.listener.forwardX){
      this.ctx.listener.forwardX.value=0; this.ctx.listener.forwardY.value=0; this.ctx.listener.forwardZ.value=-1;
      this.ctx.listener.upX.value=0; this.ctx.listener.upY.value=1; this.ctx.listener.upZ.value=0;
    }
    this.generateNoiseBuffers();
    this.isInitialized=true;
    // preload voices
    await this.loadVoices();
    this.log('AudioEngine initialized at '+this.ctx.sampleRate+'Hz');
  }
  log(m){ console.log('[Audio]',m); }
  async loadVoices(){
    return new Promise(res=>{
      const check=()=>{
        const voices=speechSynthesis.getVoices();
        if(voices.length){ this.voice = voices.find(v=>v.lang.startsWith('en'))||voices[0]; res(); }
        else setTimeout(check,100);
      };
      check();
      speechSynthesis.onvoiceschanged=check;
    });
  }
  ensure(){
    if(!this.isInitialized) throw new Error('Audio not initialized');
    if(this.ctx.state==='suspended') this.ctx.resume();
  }
  // ---- Speech ----
  speak(text, interrupt=true, rate=null){
    this.ensure();
    if(interrupt) speechSynthesis.cancel();
    // also visual log
    window.gameLog && window.gameLog(text,'speak');
    if(!('speechSynthesis' in window)){ return; }
    const u = new SpeechSynthesisUtterance(text);
    if(this.voice) u.voice=this.voice;
    u.rate = rate||this.speechRate;
    u.pitch=1.0; u.volume=1.0;
    u.onstart=()=>{ document.getElementById('visualizer-bar').style.animationDuration='0.3s'; };
    u.onend=()=>{ document.getElementById('visualizer-bar').style.animationDuration='2s'; };
    speechSynthesis.speak(u);
    // aria live
    document.getElementById('aria-live').textContent=text;
  }
  stopSpeech(){ speechSynthesis.cancel(); }
  setSpeechRate(r){ this.speechRate=Math.max(0.5,Math.min(2.0,r)); }

  // ---- Noise buffers ----
  generateNoiseBuffers(){
    const len = this.ctx.sampleRate*2;
    const white = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d = white.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noiseBuffers.white=white;
    // pink noise approx
    const pink = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const pd = pink.getChannelData(0);
    let b0,b1,b2,b3,b4,b5,b6; b0=b1=b2=b3=b4=b5=b6=0;
    for(let i=0;i<len;i++){
      const white=Math.random()*2-1;
      b0=0.99886*b0+white*0.0555179; b1=0.99332*b1+white*0.0750759; b2=0.96900*b2+white*0.1538520;
      b3=0.86650*b3+white*0.3104856; b4=0.55000*b4+white*0.5329522; b5=-0.7616*b5-white*0.0168980;
      pd[i]=(b0+b1+b2+b3+b4+b5+b6+white*0.5362)*0.11; b6=white*0.115926;
    }
    this.noiseBuffers.pink=pink;
  }
  createNoiseSource(type='white'){
    const src=this.ctx.createBufferSource();
    src.buffer=this.noiseBuffers[type]||this.noiseBuffers.white;
    src.loop=true;
    return src;
  }

  // ---- Basic tones ----
  tone({freq=440, duration=0.3, type='sine', volume=0.5, attack=0.01, release=0.1, filterFreq=null, pan=0, x=null, y=null, z=null}){
    this.ensure();
    const osc=this.ctx.createOscillator(); osc.type=type; osc.frequency.value=freq;
    const gain=this.ctx.createGain(); gain.gain.setValueAtTime(0,this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(volume,this.ctx.currentTime+attack);
    gain.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+duration);
    let last=gain;
    let filter=null;
    if(filterFreq){ filter=this.ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=filterFreq; osc.connect(filter); filter.connect(gain); }
    else osc.connect(gain);
    // panning
    if(x!==null && this.use3D){
      const panner=this.ctx.createPanner(); panner.panningModel='HRTF'; panner.distanceModel='inverse'; panner.refDistance=1; panner.maxDistance=10; panner.rolloffFactor=1;
      panner.positionX.value=x; panner.positionY.value=y||0; panner.positionZ.value=z||0;
      gain.connect(panner); panner.connect(this.sfxGain); last=panner;
    } else if(pan!==0){
      const stereo=this.ctx.createStereoPanner(); stereo.pan.value=pan; gain.connect(stereo); stereo.connect(this.sfxGain);
    } else {
      gain.connect(this.sfxGain);
    }
    osc.start(); osc.stop(this.ctx.currentTime+duration+0.1);
    return osc;
  }
  noiseTone({duration=0.5, type='white', filterFreq=1000, filterType='bandpass', volume=0.5, pan=0, x=null,y=null,z=null}){
    this.ensure();
    const src=this.createNoiseSource(type);
    const filter=this.ctx.createBiquadFilter(); filter.type=filterType; filter.frequency.value=filterFreq; filter.Q.value=1;
    const gain=this.ctx.createGain(); gain.gain.value=volume;
    gain.gain.setValueAtTime(volume,this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+duration);
    src.connect(filter); filter.connect(gain);
    if(x!==null && this.use3D){
      const panner=this.ctx.createPanner(); panner.panningModel='HRTF'; panner.positionX.value=x; panner.positionY.value=y||0; panner.positionZ.value=z||0;
      gain.connect(panner); panner.connect(this.sfxGain);
    } else if(pan!==0){
      const stereo=this.ctx.createStereoPanner(); stereo.pan.value=pan; gain.connect(stereo); stereo.connect(this.sfxGain);
    } else gain.connect(this.sfxGain);
    src.start(); src.stop(this.ctx.currentTime+duration);
  }

  // ---- Earcons & Game Sounds ----
  playEarcon(name){
    switch(name){
      case 'menu-blip': this.tone({freq:800, duration:0.12, type:'sine', volume:0.4}); break;
      case 'menu-select': this.tone({freq:600, duration:0.1, volume:0.5}); setTimeout(()=>this.tone({freq:1200, duration:0.2, volume:0.5}),80); break;
      case 'menu-back': this.tone({freq:900, duration:0.1, volume:0.4}); setTimeout(()=>this.tone({freq:400, duration:0.25, volume:0.4}),90); break;
      case 'footstep': this.footstep(); break;
      case 'bump': this.tone({freq:120, duration:0.3, type:'square', volume:0.6, filterFreq:400}); break;
      case 'door': this.door(); break;
      case 'collect': this.collect(); break;
      case 'success': this.success(); break;
      case 'fail': this.fail(); break;
      case 'coin': this.coin(); break;
      default: this.tone({freq:440, duration:0.2});
    }
  }
  footstep(){
    this.noiseTone({duration:0.12, filterFreq:300, filterType:'bandpass', volume:0.4});
    this.tone({freq:80+Math.random()*40, duration:0.15, type:'sine', volume:0.5});
  }
  door(){
    this.noiseTone({duration:0.4, filterFreq:800, volume:0.3});
    this.tone({freq:200, duration:0.5, type:'sawtooth', volume:0.3, filterFreq:600});
    setTimeout(()=>this.tone({freq:600, duration:0.3, volume:0.4}),150);
  }
  collect(){
    [0,2,4,7].forEach((st,i)=>setTimeout(()=>this.tone({freq:400*Math.pow(1.25,st), duration:0.25, volume:0.5}), i*90));
  }
  success(){
    [0,4,7,12].forEach((st,i)=>setTimeout(()=>this.tone({freq:261.63*Math.pow(2,st/12), duration:0.4, volume:0.5, type:'sine'}), i*120));
  }
  fail(){
    this.tone({freq:300, duration:0.3, type:'sawtooth', volume:0.5});
    setTimeout(()=>this.tone({freq:200, duration:0.5, type:'sawtooth', volume:0.5}),150);
  }
  coin(){
    this.tone({freq:1200, duration:0.15, volume:0.5}); setTimeout(()=>this.tone({freq:1800, duration:0.3, volume:0.5}),100);
  }

  // Procedural ingredient sounds
  playIngredientSound(id){

      case 'puff_powder':

      case 'puff_spicy':

        for(let i=0;i<10;i++) setTimeout(()=>this.tone({freq:3000+Math.random()*2000, duration:0.05, volume:0.2}), i*60);

  playMachineSound(machineId){
    switch(machineId){
      case 'mixer':
        this.tone({freq:60, duration:2.0, type:'sawtooth', volume:0.4, filterFreq:300});

        break;
      case 'extruder_puff':
        this.tone({freq:100, duration:1.2, type:'sine', volume:0.4});

        setTimeout(()=>this.tone({freq:600, duration:0.4, volume:0.5}),600);
        break;
      case 'fryer':
        this.noiseTone({duration:2.5, filterFreq:4000, filterType:'highpass', volume:0.5});
        for(let i=0;i<20;i++) setTimeout(()=>this.tone({freq:1000+Math.random()*2000, duration:0.05, volume:0.15}), i*120);
        break;
      case 'oven':

  }

  // ---- 3D Beacons for exits ----
  clearBeacons(){
    this.beaconNodes.forEach(n=>{ try{n.osc.stop(); n.src&&n.src.stop();}catch(e){} });
    this.beaconNodes=[];
  }
  playExitBeacon(dir, angleDeg, distance=2){
    const rad = angleDeg*Math.PI/180;
    const x = Math.sin(rad)*distance;
    const z = -Math.cos(rad)*distance;
    const freqMap={north:440, east:550, south:330, west:660};
    const freq=freqMap[dir]||440;
    const osc=this.ctx.createOscillator(); osc.frequency.value=freq; osc.type='sine';
    const gain=this.ctx.createGain(); gain.gain.value=0.0;
    const panner=this.ctx.createPanner(); panner.panningModel='HRTF'; panner.positionX.value=x; panner.positionY.value=0; panner.positionZ.value=z;
    osc.connect(gain); gain.connect(panner); panner.connect(this.sfxGain);
    // pulsating
    const now=this.ctx.currentTime;
    gain.gain.setValueAtTime(0,now);
    gain.gain.linearRampToValueAtTime(0.25,now+0.05);
    gain.gain.linearRampToValueAtTime(0,now+0.4);
    osc.start();
    // loop pulse every 1.5s
    const interval=setInterval(()=>{
      if(this.ctx.state==='suspended') return;
      const t=this.ctx.currentTime;
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(0.25,t+0.05);
      gain.gain.linearRampToValueAtTime(0,t+0.4);
    },1500);
    this.beaconNodes.push({osc, gain, panner, interval, dir});
    return {osc, interval};
  }
  updateListener(x,y,angleDeg){
    this.listenerPos={x,y,angle:angleDeg};
    if(!this.ctx||!this.ctx.listener) return;
    const rad=angleDeg*Math.PI/180;
    const fx=Math.sin(rad), fz=-Math.cos(rad);
    if(this.ctx.listener.forwardX){
      this.ctx.listener.forwardX.value=fx; this.ctx.listener.forwardY.value=0; this.ctx.listener.forwardZ.value=fz;
      this.ctx.listener.upX.value=0; this.ctx.listener.upY.value=1; this.ctx.listener.upZ.value=0;
      this.ctx.listener.positionX.value=x; this.ctx.listener.positionY.value=0; this.ctx.listener.positionZ.value=y;
    } else {
      this.ctx.listener.setOrientation(fx,0,fz,0,1,0);
      this.ctx.listener.setPosition(x,0,y);
    }
  }

  // ---- Ambience ----
  stopAmbience(){
    this.ambienceNodes.forEach(n=>{ try{n.stop();}catch(e){} if(n.interval) clearInterval(n.interval); });
    this.ambienceNodes=[];
    this.ambienceGain.gain.value=0.25;
  }
  startAmbience(roomId){
    this.stopAmbience();
    this.ensure();
    const room = GAME_DATA.rooms[roomId];
    if(!room) return;
    const type=room.ambience;
    const createLoop=(freq, vol, type='sine', filter=null)=>{
      const osc=this.ctx.createOscillator(); osc.type=type; osc.frequency.value=freq;
      const gain=this.ctx.createGain(); gain.gain.value=vol;
      osc.connect(gain); gain.connect(this.ambienceGain);
      osc.start();
      this.ambienceNodes.push(osc);
      return {osc,gain};
    };
    const createNoiseLoop=(filterFreq, vol, ftype='lowpass')=>{
      const src=this.createNoiseSource('pink');
      const filter=this.ctx.createBiquadFilter(); filter.type=ftype; filter.frequency.value=filterFreq;
      const gain=this.ctx.createGain(); gain.gain.value=vol;
      src.connect(filter); filter.connect(gain); gain.connect(this.ambienceGain);
      src.start();
      this.ambienceNodes.push(src);
      return {src,filter,gain};
    };
    switch(type){
      case 'lobby':
        createLoop(60,0.08,'sine'); createLoop(120,0.04,'triangle');
        createNoiseLoop(400,0.08,'lowpass');
        break;
      case 'office':
        createLoop(100,0.05,'sine'); createNoiseLoop(800,0.05,'bandpass');
        // fluorescent flicker
        const flicker=setInterval(()=>{ if(Math.random()<0.1) this.tone({freq:1000+Math.random()*500, duration:0.05, volume:0.05}); },800);
        this.ambienceNodes.push({interval:flicker, stop:()=>clearInterval(flicker)});
        break;
      case 'lab':
        createLoop(200,0.04,'sine'); createLoop(400,0.03,'sine');
        createNoiseLoop(1200,0.06,'bandpass');
        break;
      case 'breakroom':
        createLoop(60,0.06,'sine'); // fridge
        createNoiseLoop(300,0.04);
        break;
      case 'mixer':
        createLoop(50,0.12,'sawtooth'); createLoop(100,0.08,'square');
        createNoiseLoop(600,0.08);
        break;
      case 'silo':
        createNoiseLoop(200,0.12,'lowpass');
        createLoop(30,0.06,'sine');
        break;
      case 'warehouse':
        createLoop(70,0.07,'sine'); createNoiseLoop(500,0.05);
        const beep=setInterval(()=>{ if(Math.random()<0.2){ this.tone({freq:800, duration:0.3, volume:0.15, pan:-0.5}); } },3000);
        this.ambienceNodes.push({interval:beep, stop:()=>clearInterval(beep)});
        break;
      case 'extruder':
        createLoop(60,0.15,'sawtooth'); createLoop(180,0.08,'square');
        createNoiseLoop(800,0.1);
        break;
      case 'seasoning':
        createLoop(90,0.08,'sawtooth'); createNoiseLoop(1000,0.12,'bandpass');
        break;
      case 'fryer':
        createNoiseLoop(3500,0.15,'highpass'); createLoop(120,0.06,'sine');
        break;
      case 'packager':
        createLoop(100,0.05,'sine');
        const tick=setInterval(()=>{ this.tone({freq:600, duration:0.05, volume:0.1}); },700);
        this.ambienceNodes.push({interval:tick, stop:()=>clearInterval(tick)});
        break;
      case 'market':
        createNoiseLoop(400,0.08); createLoop(150,0.04,'sine');
        break;
      case 'chester':
        createLoop(40,0.1,'sine'); createLoop(80,0.05,'triangle');
        break;
    }
  }

  // ---- Speaker Test ----
  async testSpeakers(){
    this.speak('Testing speakers. Headphones recommended.', true);
    await new Promise(r=>setTimeout(r,1800));
    this.speak('Left channel.', true); this.tone({freq:440, duration:0.8, pan:-1, volume:0.7}); await new Promise(r=>setTimeout(r,1200));
    this.speak('Right channel.', true); this.tone({freq:440, duration:0.8, pan:1, volume:0.7}); await new Promise(r=>setTimeout(r,1200));
    this.speak('Center.', true); this.tone({freq:440, duration:0.8, pan:0, volume:0.7}); await new Promise(r=>setTimeout(r,1200));
    this.speak('Now, sound will circle around your head. Follow it with your ears. North, East, South, West.', true);
    await new Promise(r=>setTimeout(r,2500));
    // circle
    let angle=0;
    const osc=this.ctx.createOscillator(); osc.frequency.value=440; osc.type='sine';
    const gain=this.ctx.createGain(); gain.gain.value=0.4;
    const panner=this.ctx.createPanner(); panner.panningModel='HRTF';
    osc.connect(gain); gain.connect(panner); panner.connect(this.sfxGain);
    osc.start();
    const interval=setInterval(()=>{
      angle+=5; if(angle>=360){ clearInterval(interval); osc.stop(); this.speak('Circle test complete. If you heard movement, 3D audio works!', true); return; }
      const rad=angle*Math.PI/180;
      panner.positionX.value=Math.sin(rad)*2;
      panner.positionZ.value=-Math.cos(rad)*2;
    },60);
  }
}

// ============================================================================
// GAME ENGINE - DATA DRIVEN
// ============================================================================
class Game {
  constructor(audio){
    this.audio=audio;
    this.player={
      location:'lobby',
      x:0,y:0,angle:0, // for 3D listener
      inventory:{},
      money:20,
      xp:0,
      level:1,
      title:'Intern',
      quests:{},
      unlocked:{cornmeal:true, water:true, salt:true},
      stats:{bagsMade:0, steps:0}
    };
    this.roomPositions={
      'lobby':{x:0,y:0}, 'hr-office':{x:0,y:1}, 'r-and-d':{x:1,y:1}, 'break-room':{x:1,y:0},
      'quality-lab':{x:1,y:1}, 'mixing-lab':{x:0,y:2}, 'corn-silo':{x:-1,y:2}, 'warehouse':{x:-1,y:0},
      'extruder-floor':{x:1,y:2}, 'seasoning-tunnel':{x:2,y:2}, 'fryer-room':{x:2,y:1}, 'packaging-line':{x:2,y:0},
      'market':{x:-2,y:0}, 'chester-office':{x:0,y:-1}
    };
    this.dirAngles={north:0, east:90, south:180, west:270};
    this.isPaused=false;
    this.menuStack=[];
  }
  log(msg,cls=''){ window.gameLog(msg,cls); }
  // ---- Save/Load ----
  save(){
    try{ localStorage.setItem('cheetosAudioFactorySave_v1', JSON.stringify(this.player)); this.log('Game saved.','sys'); this.audio.playEarcon('coin'); }catch(e){ this.log('Save failed: '+e,'sys'); }
  }
  load(){
    try{
      const data=localStorage.getItem('cheetosAudioFactorySave_v1');
      if(!data) return false;
      this.player=JSON.parse(data);
      this.log('Game loaded. Welcome back!','sys');
      return true;
    }catch(e){ return false; }
  }
  hasSave(){ return !!localStorage.getItem('cheetosAudioFactorySave_v1'); }

  // ---- Level ----
  checkLevel(){
    const levels=GAME_DATA.levels.slice().reverse();
    for(const lvl of levels){
      if(this.player.xp>=lvl.xpNeeded && this.player.level<lvl.level){
        this.player.level=lvl.level; this.player.title=lvl.title;
        this.audio.speak(`Promotion! You are now Level ${lvl.level} ${lvl.title}. ${lvl.desc}`, true);
        this.log(`*** PROMOTION! Level ${lvl.level} ${lvl.title} ***`,'sys');
        this.audio.playEarcon('success');
        this.save();
        break;
      }
    }
    // update UI
    document.getElementById('level-display').textContent=`LVL ${this.player.level} ${this.player.title}`;
  }

  // ---- Room ----
  enterRoom(roomId, fromDir=null){
    const room=GAME_DATA.rooms[roomId];
    if(!room){ this.audio.speak('Room not found'); return; }
    // check locked
    if(roomId==='chester-office' && this.player.level<5){
      this.audio.speak('Chester office locked. You need Level 5. You are level '+this.player.level);
      this.audio.playEarcon('fail'); this.audio.playEarcon('bump'); return;
    }
    this.player.location=roomId;
    const pos=this.roomPositions[roomId]||{x:0,y:0};
    this.player.x=pos.x; this.player.y=pos.y;
    if(fromDir){ // face opposite of entry? face into room
      const opposite={north:180, south:0, east:270, west:90};
      if(opposite[fromDir]) this.player.angle=opposite[fromDir];
    }
    this.audio.updateListener(pos.x,pos.y,this.player.angle);
    this.audio.startAmbience(roomId);
    this.audio.playEarcon('door');
    this.describeRoom(true);
    document.getElementById('location-display').textContent=room.name.toUpperCase();
    this.player.stats.steps++;
    this.checkQuests();
    this.save();
  }
  describeRoom(full=true){
    const room=GAME_DATA.rooms[this.player.location];
    if(!room) return;
    this.log(`\n=== ${room.name} ===`,'room');
    this.log(room.desc);
    // speak
    let speech=`${room.name}. ${room.desc}`;
    // exits
    const exits=Object.keys(room.exits);
    if(exits.length){
      const exitText=exits.join(', ');
      this.log(`Exits: ${exitText}`,'sys');
      speech+=` Exits: ${exitText}.`;
    }
    // objects
    if(room.objects && room.objects.length){
      const objNames=room.objects.map(o=>o.name).join(', ');
      this.log(`Objects: ${objNames}`,'sys');
      speech+=` Objects here: ${objNames}.`;
    }
    // npcs
    if(room.npcs && room.npcs.length){
      const npcNames=room.npcs.map(id=>GAME_DATA.npcs[id]?.name||id).join(', ');
      this.log(`People: ${npcNames}`,'sys');
      speech+=` People here: ${npcNames}.`;
    }
    // machines
    if(room.machines && room.machines.length){
      const mNames=room.machines.map(id=>GAME_DATA.machines[id]?.name||id).join(', ');
      this.log(`Machines: ${mNames}`,'sys');
      speech+=` Machines: ${mNames}.`;
    }
    this.audio.speak(speech, true);
    // beacons after speech a bit
    setTimeout(()=>this.playExitBeacons(), 1200);
  }
  playExitBeacons(){
    this.audio.clearBeacons();
    const room=GAME_DATA.rooms[this.player.location];
    if(!room) return;
    for(const [dir,target] of Object.entries(room.exits)){
      const baseAngle=this.dirAngles[dir]||0;
      const relative = (baseAngle - this.player.angle + 360)%360;
      // convert relative to panner angle: 0 is ahead, 90 right
      this.audio.playExitBeacon(dir, relative, 2.5);
    }
  }
  scanRoom(){
    this.audio.speak(`Scanning ${GAME_DATA.rooms[this.player.location].name}.`, true);
    this.audio.playEarcon('menu-blip');
    setTimeout(()=>{ this.describeRoom(false); },400);
  }

  // ---- Movement ----
  move(dir){
    const room=GAME_DATA.rooms[this.player.location];
    if(!room) return;
    const target=room.exits[dir];
    if(!target){
      this.audio.playEarcon('bump');
      this.audio.speak(`No exit to ${dir}. Available: ${Object.keys(room.exits).join(', ')}`);
      return;
    }
    // check locked exits
    if(room.lockedExits && room.lockedExits[dir]){
      const lock=room.lockedExits[dir];
      if(this.player.level < lock.level){
        this.audio.speak(lock.msg); this.audio.playEarcon('fail'); return;
      }
    }
    this.audio.playEarcon('footstep');
    setTimeout(()=>this.enterRoom(target, dir), 250);
  }
  turn(delta){
    this.player.angle=(this.player.angle+delta+360)%360;
    this.audio.updateListener(this.player.x,this.player.y,this.player.angle);
    const dirs=['north','east','south','west'];
    const idx=Math.round(this.player.angle/90)%4;
    const facing=dirs[idx]||'north';
    this.audio.speak(`Facing ${facing}`, true);
    this.audio.playEarcon('menu-blip');
    this.playExitBeacons();
  }
  turnTo(dir){
    const angle=this.dirAngles[dir];
    if(angle!==undefined){ this.player.angle=angle; this.audio.updateListener(this.player.x,this.player.y,angle); this.audio.speak(`Facing ${dir}`); this.playExitBeacons(); }
  }

  // ---- Inventory ----
  addItem(id, qty=1){
    this.player.inventory[id]=(this.player.inventory[id]||0)+qty;
    this.updateMoneyUI();
  }
  removeItem(id, qty=1){
    if(!this.player.inventory[id]||this.player.inventory[id]<qty) return false;
    this.player.inventory[id]-=qty;
    if(this.player.inventory[id]<=0) delete this.player.inventory[id];
    this.updateMoneyUI();
    return true;
  }
  hasItem(id, qty=1){ return (this.player.inventory[id]||0)>=qty; }
  getInventoryText(){
    const inv=this.player.inventory;
    const keys=Object.keys(inv);
    if(!keys.length) return 'Your bag is empty.';
    let text='Your bag contains: ';
    let log='--- INVENTORY ---\n';
    keys.forEach(k=>{
      const name = (GAME_DATA.ingredients[k]?.name || GAME_DATA.intermediates[k]?.name || k);
      const qty=inv[k];
      text+=`${qty} ${name}, `;
      log+=`${name} x${qty}\n`;
    });
    text+=` Money: $${this.player.money}, XP: ${this.player.xp}, Level: ${this.player.level} ${this.player.title}.`;
    log+=`\nMoney: $${this.player.money}\nXP: ${this.player.xp}\nLevel: ${this.player.level} ${this.player.title}\nBags made: ${this.player.stats.bagsMade}`;
    this.log(log,'sys');
    return text;
  }
  updateMoneyUI(){ document.getElementById('money-display').textContent=`$${this.player.money}`; }

  // ---- Interaction ----
  interact(){
    const room=GAME_DATA.rooms[this.player.location];
    if(!room) return;
    const options=[];
    // NPCs
    (room.npcs||[]).forEach(npcId=>{ const npc=GAME_DATA.npcs[npcId]; if(npc) options.push({type:'npc', id:npcId, name:`Talk to ${npc.name}`, obj:npc}); });
    // Objects
    (room.objects||[]).forEach(o=> options.push({type:'object', id:o.id, name:o.name, obj:o}));
    // Machines
    (room.machines||[]).forEach(mId=>{ const m=GAME_DATA.machines[mId]; if(m) options.push({type:'machine', id:mId, name:`Use ${m.name}`, obj:m}); });
    if(!options.length){ this.audio.speak('Nothing to interact with here. Try moving.'); return; }
    this.showInteractMenu(options);
  }
  showInteractMenu(options){
    const menuItems=options.map(o=>({label:o.name, value:o}));
    menuItems.push({label:'Cancel', value:null});
    this.showMenu('Interact - What?', menuItems, (selected)=>{
      if(!selected) return;
      const {type,id,obj}=selected;
      if(type==='npc') this.talkToNPC(id);
      else if(type==='object') this.interactObject(obj);
      else if(type==='machine') this.openMachineMenu(id);
    });
  }
  interactObject(obj){
    this.log(`Interacting with ${obj.name}: ${obj.desc}`,'sys');
    this.audio.speak(`${obj.name}. ${obj.desc}`);
    // handle specific objects
    switch(obj.id){
      case 'corn-chute':
        this.collectIngredient('cornmeal', 3);
        break;
      case 'salt-bin':
        this.collectIngredient('salt', 2);
        break;
      case 'water-cooler':
      case 'water-pipe':
        this.collectIngredient('water', 3);
        break;
      case 'oil-drum':
        this.buyIngredient('vegetableOil', 3);
        break;
      case 'flour-pallet':
        this.buyIngredient('crackerFlour', 3);
        break;
      case 'cheddar-hopper':
        this.buyIngredient('cheddarDust', 8);
        break;
      case 'flamin-hopper':
        this.buyIngredient('flaminDust', 12);
        break;
      case 'flavor-shelf':
        this.openFlavorShop();
        break;
      case 'vending':
        this.openFlavorShop();
        break;
      case 'market-stall':
        this.openMarketSell();
        break;
      case 'crunch-tester':
        this.testCrunch();
        break;
      case 'badge-printer':
        this.audio.speak(`Your current level is ${this.player.level} ${this.player.title}. XP ${this.player.xp}. Next promotion at ${GAME_DATA.levels.find(l=>l.level===this.player.level+1)?.xpNeeded||'MAX'} XP.`);
        break;
      case 'golden-bowl':
        if(this.player.level>=5){ this.collectIngredient('xxtraHotPowder',1); this.audio.speak('Golden bowl! You got XXXtra hot powder!'); }
        else this.audio.speak('Golden bowl is locked behind glass. Need level 5.');
        break;
      case 'statue':
        this.audio.playEarcon('success'); this.audio.speak('You rub Chester statue for luck. Meow. You feel cheesier. Bonus 5 XP!'); this.player.xp+=5; this.checkLevel();
        break;
      default:
        this.audio.playEarcon('collect');
    }
  }
  collectIngredient(id, priceOrQty){
    const ing=GAME_DATA.ingredients[id];
    if(!ing) return;
    if(ing.free){
      const qty=2+Math.floor(Math.random()*3);
      this.addItem(id, qty);
      this.audio.playIngredientSound(ing.sound);
      this.audio.speak(`Collected ${qty} ${ing.name}. You now have ${this.player.inventory[id]}.`);
      this.log(`+${qty} ${ing.name}`,'sys');
    } else {
      this.buyIngredient(id, ing.buyPrice||priceOrQty);
    }
  }
  buyIngredient(id, price){
    const ing=GAME_DATA.ingredients[id];
    if(!ing) return;
    const cost=price||ing.buyPrice||5;
    if(this.player.money<cost){ this.audio.speak(`Not enough money. Need $${cost}, you have $${this.player.money}. Sell bags at market.`); this.audio.playEarcon('fail'); return; }
    this.player.money-=cost;
    this.addItem(id,1);
    this.audio.playIngredientSound(ing.sound);
    this.audio.playEarcon('coin');
    this.audio.speak(`Bought 1 ${ing.name} for $${cost}. Money left $${this.player.money}.`);
    this.log(`Bought ${ing.name} -$${cost}`,'sys');
    this.updateMoneyUI();
  }
  openFlavorShop(){
    const available=Object.values(GAME_DATA.ingredients).filter(i=>!i.free && this.player.level>= (i.id==='xxtraHotPowder'?5:1));
    const items=available.map(ing=>({label:`${ing.name} - $${ing.buyPrice} (you have ${this.player.inventory[ing.id]||0})`, value:ing.id}));
    items.push({label:'Cancel', value:null});
    this.showMenu('Flavor Shop - Buy', items, (id)=>{
      if(!id) return;
      const ing=GAME_DATA.ingredients[id];
      if(ing) this.buyIngredient(id, ing.buyPrice);
      setTimeout(()=>this.openFlavorShop(),800);
    });
  }
  openMarketSell(){
    const bags=Object.keys(this.player.inventory).filter(k=>k.endsWith('-bag'));
    if(!bags.length){ this.audio.speak('You have no bags to sell. Make Cheetos first!'); return; }
    const items=bags.map(bagId=>{
      const proc=GAME_DATA.processes.find(p=>p.outputs && p.outputs[bagId]);
      const value=proc?.value||10;
      const qty=this.player.inventory[bagId];
      return {label:`${bagId.replace(/-/g,' ')} x${qty} - $${value} each`, value:bagId};
    });
    items.push({label:'Sell ALL bags', value:'__sell_all'});
    items.push({label:'Cancel', value:null});
    this.showMenu('Market - Sell Bags', items, (selected)=>{
      if(!selected) return;
      if(selected==='__sell_all'){ this.sellAllBags(); return; }
      this.sellBag(selected);
      setTimeout(()=>this.openMarketSell(),700);
    });
  }
  sellBag(bagId){
    const qty=this.player.inventory[bagId]||0;
    if(qty<=0) return;
    const proc=GAME_DATA.processes.find(p=>p.outputs && p.outputs[bagId]);
    const value=proc?.value||10;
    this.removeItem(bagId,1);
    this.player.money+=value;
    this.audio.playEarcon('coin');
    this.audio.speak(`Sold 1 ${bagId.replace(/-/g,' ')} for $${value}. Money $${this.player.money}.`);
    this.log(`Sold ${bagId} +$${value}`,'sys');
    this.updateMoneyUI();
    this.checkQuests();
  }
  sellAllBags(){
    let total=0, count=0;
    Object.keys(this.player.inventory).forEach(bagId=>{
      if(!bagId.endsWith('-bag')) return;
      const qty=this.player.inventory[bagId];
      const proc=GAME_DATA.processes.find(p=>p.outputs && p.outputs[bagId]);
      const value=proc?.value||10;
      total+=qty*value; count+=qty;
      delete this.player.inventory[bagId];
    });
    if(count===0){ this.audio.speak('No bags.'); return; }
    this.player.money+=total;
    this.audio.playEarcon('success');
    this.audio.speak(`Sold ${count} bags for $${total}. Total money $${this.player.money}.`);
    this.log(`Sold ALL ${count} bags +$${total}`,'sys');
    this.updateMoneyUI();
  }
  testCrunch(){
    const bags=Object.keys(this.player.inventory).filter(k=>k.endsWith('-bag'));
    if(!bags.length){ this.audio.speak('Bring a bag to test crunch.'); return; }
    const bagId=bags[Math.floor(Math.random()*bags.length)];
    const quality=Math.random();
    if(quality>0.7){
      const bonus=10; this.player.money+=bonus;
      this.audio.speak(`Crunch test: Perfect! ${bagId} is extra crunchy! Bonus $${bonus}.`); this.audio.playEarcon('success');
    } else {
      this.audio.speak(`Crunch test: Good. ${bagId} passes quality. Crunch level ${Math.floor(quality*100)} percent.`);
    }
  }

  // ---- NPC Talk ----
  talkToNPC(npcId){
    const npc=GAME_DATA.npcs[npcId];
    if(!npc) return;
    this.log(`Talking to ${npc.name}: ${npc.greet}`,'sys');
    this.audio.speak(`${npc.name} says: ${npc.greet}`, true);
    // simple dialogue: pick first
    if(npc.dialogues && npc.dialogues.length){
      const dlg=npc.dialogues[0];
      setTimeout(()=>{
        this.audio.speak(dlg.text);
        if(dlg.action==='promote'){ this.audio.speak(`You are level ${this.player.level} ${this.player.title}.`); }
        if(dlg.action==='open-market'){ setTimeout(()=>this.openMarketSell(),1000); }
        if(dlg.quest){ this.startQuest(dlg.quest); }
      },1200);
    }
    // voice effect: play tone with NPC voice profile
    this.playNPCVoice(npc);
  }
  playNPCVoice(npc){
    const base=npc.voice?.base||200;
    for(let i=0;i<4;i++) setTimeout(()=>{ this.audio.tone({freq:base+Math.random()*100, duration:0.15, type:'sawtooth', volume:0.15, filterFreq:800}); }, i*180);
  }
  startQuest(qId){
    const quest=GAME_DATA.quests[qId];
    if(!quest) return;
    if(this.player.quests[qId]) return;
    this.player.quests[qId]={started:true, completed:false};
    this.log(`NEW QUEST: ${quest.name} - ${quest.desc}`,'sys');
    this.audio.speak(`New quest: ${quest.name}. ${quest.desc}`);
  }
  checkQuests(){
    for(const [qId,state] of Object.entries(this.player.quests)){
      if(state.completed) continue;
      const quest=GAME_DATA.quests[qId];
      if(!quest) continue;
      let completed=false;
      if(qId==='tutorial-1'){
        if(this.hasItem('classic-crunchy-bag',1)) completed=true;
      } else if(qId==='unlock-xxtra'){
        if(this.hasItem('classic-crunchy-bag',3)) completed=true;
      } else if(qId==='chester-final'){
        const finals=GAME_DATA.processes.filter(p=>p.final).map(p=>Object.keys(p.outputs)[0]);
        completed=finals.every(f=>this.hasItem(f,1));
      }
      if(completed){
        state.completed=true;
        this.player.money+=quest.reward.money||0;
        this.player.xp+=quest.reward.xp||0;
        this.log(`QUEST COMPLETE: ${quest.name}! Reward: $${quest.reward.money||0} XP ${quest.reward.xp||0}`,'sys');
        this.audio.speak(`Quest complete! ${quest.name}! Reward ${quest.reward.money||0} dollars and ${quest.reward.xp||0} XP.`, true);
        this.audio.playEarcon('success');
        if(quest.reward.unlock){ this.player.unlocked[quest.reward.unlock]=true; this.audio.speak(`Unlocked ${quest.reward.unlock}!`); }
        this.checkLevel();
        this.save();
      }
    }
  }

  // ---- Machines ----
  openMachineMenu(machineId){
    const machine=GAME_DATA.machines[machineId];
    if(!machine){ this.audio.speak('Machine not found'); return; }
    this.log(`Using ${machine.name}: ${machine.desc}`,'sys');
    this.audio.speak(`${machine.name}. ${machine.desc}`);
    this.audio.playMachineSound(machine.sound);
    // find processes for this machine that player level unlocks
    const available=GAME_DATA.processes.filter(p=>p.machine===machineId && this.player.level>=p.unlockLevel);
    if(!available.length){ this.audio.speak('No recipes unlocked for this machine yet. Level up!'); return; }
    const craftable=available.filter(p=>{
      for(const [ing,qty] of Object.entries(p.inputs)){ if(!this.hasItem(ing, qty)) return false; }
      return true;
    });
    const items=available.map(p=>{
      const canCraft=craftable.includes(p);
      const inputs=Object.entries(p.inputs).map(([k,q])=>`${q} ${k}`).join(', ');
      const outputs=Object.entries(p.outputs).map(([k,q])=>`${q} ${k}`).join(', ');
      const status=canCraft?'✓ CAN MAKE':'✗ missing ingredients';
      return {label:`${p.name} - ${status} | Needs: ${inputs} -> Makes: ${outputs}`, value:p.id, disabled:!canCraft};
    });
    items.push({label:'Cancel', value:null});
    this.showMenu(`${machine.name} - Recipes (Level ${this.player.level})`, items, (procId)=>{
      if(!procId) return;
      this.craft(procId);
      setTimeout(()=>this.openMachineMenu(machineId),1000);
    });
  }
  craft(procId){
    const proc=GAME_DATA.processes.find(p=>p.id===procId);
    if(!proc){ this.audio.speak('Recipe not found'); return; }
    // check inputs
    for(const [ing,qty] of Object.entries(proc.inputs)){
      if(!this.hasItem(ing, qty)){ this.audio.speak(`Missing ${qty} ${ing}. You have ${this.player.inventory[ing]||0}.`); this.audio.playEarcon('fail'); return; }
    }
    // consume
    for(const [ing,qty] of Object.entries(proc.inputs)) this.removeItem(ing, qty);
    // produce
    for(const [out,qty] of Object.entries(proc.outputs)) this.addItem(out, qty);
    this.audio.playMachineSound(proc.sound);
    this.audio.playEarcon('success');
    const outNames=Object.entries(proc.outputs).map(([k,q])=>`${q} ${k}`).join(', ');
    this.audio.speak(`Made ${outNames}! ${proc.desc}`);
    this.log(`Crafted: ${proc.name} -> ${outNames} +${proc.xp} XP`,'sys');
    this.player.xp+=proc.xp||5;
    if(proc.final) this.player.stats.bagsMade++;
    this.checkLevel();
    this.checkQuests();
    this.save();
  }

  // ---- Menu System ----
  showMenu(title, items, callback){
    const overlay=document.getElementById('menu-overlay');
    const box=document.getElementById('menu-box');
    box.innerHTML=`<h2>${title}</h2><div id="menu-items"></div><p style="margin-top:1rem;font-size:0.8rem;color:#aaa">Use ↑↓ or W/S to navigate, ENTER to select, ESC to cancel. Touch: tap item.</p>`;
    const container=box.querySelector('#menu-items');
    let selected=0;
    const render=()=>{
      container.innerHTML='';
      items.forEach((it,i)=>{
        const div=document.createElement('div');
        div.className='menu-item'+(i===selected?' selected':'');
        div.textContent=it.label;
        if(it.disabled) div.style.opacity='0.5';
        div.onclick=()=>{ selected=i; choose(); };
        container.appendChild(div);
      });
    };
    const speakCurrent=()=>{ const it=items[selected]; if(it) { this.audio.playEarcon('menu-blip'); this.audio.speak(it.label, true); } };
    const choose=()=>{
      const it=items[selected];
      if(!it) return;
      if(it.disabled){ this.audio.playEarcon('fail'); this.audio.speak('Cannot make, missing ingredients'); return; }
      overlay.classList.add('hidden');
      document.removeEventListener('keydown', keyHandler);
      this.audio.playEarcon('menu-select');
      callback(it.value);
    };
    const keyHandler=(e)=>{
      if(e.key==='ArrowUp' || e.key==='w' || e.key==='W'){ e.preventDefault(); selected=(selected-1+items.length)%items.length; render(); speakCurrent(); }
      else if(e.key==='ArrowDown' || e.key==='s' || e.key==='S'){ e.preventDefault(); selected=(selected+1)%items.length; render(); speakCurrent(); }
      else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); choose(); }
      else if(e.key==='Escape'){ e.preventDefault(); overlay.classList.add('hidden'); document.removeEventListener('keydown', keyHandler); this.audio.playEarcon('menu-back'); callback(null); }
    };
    document.addEventListener('keydown', keyHandler);
    overlay.classList.remove('hidden');
    render();
    speakCurrent();
    // touch swipe for menu?
  }
}

window.gameLog=(msg,cls='')=>{
  const logEl=document.getElementById('log');
  if(!logEl) return;
  const line=document.createElement('div');
  line.textContent=msg;
  if(cls) line.className=cls;
  logEl.appendChild(line);
  logEl.scrollTop=logEl.scrollHeight;
  // keep max 500 lines
  while(logEl.children.length>500) logEl.removeChild(logEl.firstChild);
};

let audioEngine=null;
let game=null;
let currentMenu=null;
let menuIndex=0;
const mainMenuOptions=()=>{
  const opts=[
    {id:'start', label:'Start New Shift - Begin as Intern'},
    {id:'load', label:'Continue Shift - Load Save', disabled:!(game && game.hasSave())},
    {id:'test', label:'Test Speakers - Check 3D Audio Left Right'},
    {id:'howto', label:'How to Play - Learn Controls'},
    {id:'settings', label:'Settings - Speech Rate and 3D Audio'},
  ];
  return opts;
};
function showMainMenu(){
  const overlay=document.getElementById('menu-overlay');
  const box=document.getElementById('menu-box');
  const opts=mainMenuOptions();
  let sel=0;
  const render=()=>{
    box.innerHTML=`<h2>🧀 CHEETOS FACTORY AUDIO OPS - MAIN MENU</h2><div id="main-menu-items"></div><p style="margin-top:1rem;color:#aaa;font-size:0.85rem">Arrow keys / W S to move, ENTER to select. Touch tap. ESC in game for pause.</p>`;
    const cont=box.querySelector('#main-menu-items');
    opts.forEach((o,i)=>{
      const d=document.createElement('div'); d.className='menu-item'+(i===sel?' selected':''); d.textContent=o.label; if(o.disabled) d.style.opacity='0.4';
      d.onclick=()=>{ sel=i; activate(); };
      cont.appendChild(d);
    });
  };
  const speak=()=>{ const o=opts[sel]; if(o){ audioEngine.playEarcon('menu-blip'); audioEngine.speak(o.label, true); } };
  const activate=()=>{
    const o=opts[sel];
    if(o.disabled){ audioEngine.playEarcon('fail'); audioEngine.speak('Option disabled. No save found.'); return; }
    audioEngine.playEarcon('menu-select');
    if(o.id==='start'){ overlay.classList.add('hidden'); startNewGame(); }
    else if(o.id==='load'){ overlay.classList.add('hidden'); loadGame(); }
    else if(o.id==='test'){ audioEngine.testSpeakers(); }
    else if(o.id==='howto'){ showHowTo(); }
    else if(o.id==='settings'){ showSettings(); }
  };
  const keyHandler=(e)=>{
    if(e.key==='ArrowUp' || e.key==='w'){ e.preventDefault(); sel=(sel-1+opts.length)%opts.length; render(); speak(); }
    else if(e.key==='ArrowDown' || e.key==='s'){ e.preventDefault(); sel=(sel+1)%opts.length; render(); speak(); }
    else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); activate(); }
  };
  document.addEventListener('keydown', keyHandler);
  // remove handler when menu closed? We'll keep but overlay hidden check
  const observer=new MutationObserver(()=>{ if(overlay.classList.contains('hidden')){ document.removeEventListener('keydown', keyHandler); observer.disconnect(); } });
  observer.observe(overlay,{attributes:true});
  overlay.classList.remove('hidden');
  render(); speak();
}

function showSettings(){
  const overlay=document.getElementById('menu-overlay');
  const box=document.getElementById('menu-box');
  const renderSettings=()=>{
    box.innerHTML=`
      <h2>Settings</h2>
      <div class="menu-item" data-action="rate-down">Speech Rate Slower - Current ${audioEngine.speechRate.toFixed(1)}</div>
      <div class="menu-item" data-action="rate-up">Speech Rate Faster - Current ${audioEngine.speechRate.toFixed(1)}</div>
      <div class="menu-item" data-action="toggle3d">3D Audio: ${audioEngine.use3D?'ON - HRTF':'OFF - Stereo'}</div>
      <div class="menu-item selected" data-action="back">Back to Main Menu</div>
    `;
    box.querySelectorAll('.menu-item').forEach(el=>{
      el.onclick=()=>{
        const act=el.dataset.action;
        if(act==='rate-down'){ audioEngine.setSpeechRate(audioEngine.speechRate-0.1); audioEngine.speak(`Rate ${audioEngine.speechRate.toFixed(1)}`); renderSettings(); }
        else if(act==='rate-up'){ audioEngine.setSpeechRate(audioEngine.speechRate+0.1); audioEngine.speak(`Rate ${audioEngine.speechRate.toFixed(1)}`); renderSettings(); }
        else if(act==='toggle3d'){ audioEngine.use3D=!audioEngine.use3D; audioEngine.speak(`3D audio ${audioEngine.use3D?'on':'off'}`); renderSettings(); }
        else if(act==='back'){ overlay.classList.add('hidden'); showMainMenu(); }
      };
    });
  };
  renderSettings();
  audioEngine.speak('Settings. Adjust speech rate and 3D audio.', true);
}
function startNewGame(){
  game=new Game(audioEngine);
  game.player.money=20; game.player.xp=0; game.player.level=1; game.player.inventory={}; game.player.quests={};
  game.updateMoneyUI();
  game.log('=== NEW SHIFT STARTED ===','sys');
  game.log('You are intern. Welcome to Cheetos Factory! Go to HR office north for badge.', 'sys');
  audioEngine.speak('New shift started! You are intern at Cheetos factory. Welcome! You are in lobby. North is HR office. East is break room. West is warehouse. Find corn silo to start. Press H for help. Good luck!', true);
  document.getElementById('game-root').classList.remove('hidden');
  game.enterRoom('lobby');
  game.startQuest('tutorial-1');
  setupGameInput();
}
function loadGame(){
  if(!game) game=new Game(audioEngine);
  if(game.load()){
    document.getElementById('game-root').classList.remove('hidden');
    game.updateMoneyUI();
    audioEngine.speak(`Welcome back! Level ${game.player.level} ${game.player.title}. Money $${game.player.money}. Returning to ${game.player.location}.`, true);
    game.enterRoom(game.player.location);
    setupGameInput();
  } else {
    audioEngine.speak('No save found. Starting new game.');
    startNewGame();
  }
}
function setupGameInput(){
  // Keyboard
  document.addEventListener('keydown', gameKeyHandler);
  // Touch buttons
  document.getElementById('touch-up').onclick=()=>game.move('north');
  document.getElementById('touch-down').onclick=()=>game.move('south');
  document.getElementById('touch-left').onclick=()=>game.move('west');
  document.getElementById('touch-right').onclick=()=>game.move('east');
  document.getElementById('touch-center').onclick=()=>game.interact();
  document.getElementById('btn-menu').onclick=()=>showPauseMenu();
  document.getElementById('btn-inventory').onclick=()=>{ const txt=game.getInventoryText(); audioEngine.speak(txt, true); };
  document.getElementById('btn-scan').onclick=()=>game.scanRoom();
  document.getElementById('btn-help').onclick=()=>{ game.describeRoom(); audioEngine.speak('Controls: W A S D or arrows to move, ENTER to interact, I inventory, H help, SPACE scan, ESC menu.', false); };
  // Swipe detection
  let touchStartX=0, touchStartY=0;
  const logEl=document.getElementById('log');
  logEl.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
  logEl.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)<10 && Math.abs(dy)<10){ game.interact(); return; }
    if(Math.abs(dx)>Math.abs(dy)){
      if(dx>50) game.move('east'); else if(dx<-50) game.move('west');
    } else {
      if(dy<-50) game.move('north'); else if(dy>50) game.move('south');
    }
  }, {passive:true});
}
function gameKeyHandler(e){
  if(document.getElementById('menu-overlay') && !document.getElementById('menu-overlay').classList.contains('hidden')) return; // menu handles its own
  if(!game) return;
  switch(e.key){
    case 'w': case 'W': case 'ArrowUp': e.preventDefault(); game.move('north'); break;
    case 's': case 'S': case 'ArrowDown': e.preventDefault(); game.move('south'); break;
    case 'a': case 'A': case 'ArrowLeft': e.preventDefault(); game.move('west'); break;
    case 'd': case 'D': case 'ArrowRight': e.preventDefault(); game.move('east'); break;
    case 'q': case 'Q': e.preventDefault(); game.turn(-90); break;
    case 'e': case 'E': e.preventDefault(); game.interact(); break;
    case 'Enter': case ' ': e.preventDefault(); if(e.key===' ') game.scanRoom(); else game.interact(); break;
    case 'i': case 'I': e.preventDefault(); { const txt=game.getInventoryText(); audioEngine.speak(txt, true); } break;
    case 'h': case 'H': e.preventDefault(); game.describeRoom(); break;
    case 'm': case 'M': e.preventDefault(); {
      const room=GAME_DATA.rooms[game.player.location];
      if(room.machines && room.machines.length) game.openMachineMenu(room.machines[0]);
      else audioEngine.speak('No machine here.');
    } break;
    case 'Escape': e.preventDefault(); showPauseMenu(); break;
  }
}
function showPauseMenu(){
  const overlay=document.getElementById('menu-overlay');
  const box=document.getElementById('menu-box');
  const opts=[
    {label:'Resume Shift', value:'resume'},
    {label:'Scan Room - Hear Exits', value:'scan'},
    {label:'Inventory - Hear Bag', value:'inv'},
    {label:'Save Game', value:'save'},
    {label:'How to Play', value:'howto'},
    {label:'Settings', value:'settings'},
    {label:'Main Menu - Abandon Shift', value:'main'},
  ];
  let sel=0;
  const render=()=>{
    box.innerHTML=`<h2>Pause - ${game?GAME_DATA.rooms[game.player.location].name:'Game'}</h2><div id="pause-items"></div>`;
    const cont=box.querySelector('#pause-items');
    opts.forEach((o,i)=>{
      const d=document.createElement('div'); d.className='menu-item'+(i===sel?' selected':''); d.textContent=o.label;
      d.onclick=()=>{ sel=i; activate(); }; cont.appendChild(d);
    });
  };
  const speak=()=>{ audioEngine.playEarcon('menu-blip'); audioEngine.speak(opts[sel].label, true); };
  const activate=()=>{
    const o=opts[sel];
    audioEngine.playEarcon('menu-select');
    overlay.classList.add('hidden');
    if(o.value==='resume') return;
    else if(o.value==='scan'){ game.scanRoom(); }
    else if(o.value==='inv'){ const txt=game.getInventoryText(); audioEngine.speak(txt,true); }
    else if(o.value==='save'){ game.save(); audioEngine.speak('Game saved.'); }
    else if(o.value==='howto'){ showHowToPause(); }
    else if(o.value==='settings'){ showSettingsPause(); }
    else if(o.value==='main'){ document.getElementById('game-root').classList.add('hidden'); document.removeEventListener('keydown', gameKeyHandler); showMainMenu(); }
  };
  const keyHandler=(e)=>{
    if(e.key==='ArrowUp' || e.key==='w'){ e.preventDefault(); sel=(sel-1+opts.length)%opts.length; render(); speak(); }
    else if(e.key==='ArrowDown' || e.key==='s'){ e.preventDefault(); sel=(sel+1)%opts.length; render(); speak(); }
    else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); document.removeEventListener('keydown', keyHandler); activate(); }
    else if(e.key==='Escape'){ e.preventDefault(); document.removeEventListener('keydown', keyHandler); overlay.classList.add('hidden'); }
  };
  document.addEventListener('keydown', keyHandler);
  overlay.classList.remove('hidden');
  render(); speak();
  function showHowToPause(){
    showHowTo();
    // override back to pause
    setTimeout(()=>{
      const back=document.getElementById('howto-back');
      if(back){ back.onclick=()=>{ document.getElementById('menu-overlay').classList.add('hidden'); showPauseMenu(); }; }
    },100);
  }
  function showSettingsPause(){
    showSettings();
    setTimeout(()=>{
      const box=document.getElementById('menu-box');
      const back=box.querySelector('[data-action="back"]');
      if(back){ back.onclick=()=>{ document.getElementById('menu-overlay').classList.add('hidden'); showPauseMenu(); }; }
    },100);
  }
}

// ============================================================================
// INIT - TAP TO START
// ============================================================================
async function boot(){
  const overlay=document.getElementById('overlay');
  const start=async()=>{
    overlay.classList.add('hidden');
    if(!audioEngine){ audioEngine=new AudioEngine(); await audioEngine.init(); }
    if(!game) game=new Game(audioEngine);
    document.getElementById('game-root').classList.remove('hidden');
    document.getElementById('game-root').classList.add('hidden'); // hide until menu choice
    showMainMenu();
    // auto speak welcome
    setTimeout(()=>audioEngine.speak('Welcome to Cheetos Factory Audio Ops! Blind accessible audio game. Main menu: Start new shift, Continue shift, Test speakers, How to play, Settings. Use arrow keys or W S to navigate, Enter to select. Touch: tap menu items.', true),500);
  };
  overlay.addEventListener('click', start, {once:true});
  overlay.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); start(); } });
  overlay.focus();
  // Try auto init on Windows as requested
  if(navigator.platform && navigator.platform.toLowerCase().includes('win')){
    // still need gesture but try
    document.addEventListener('keydown', ()=>{ if(!audioEngine) start(); }, {once:true});
  }
}
window.addEventListener('load', boot);
