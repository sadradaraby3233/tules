[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tules"
version = "2.0.0"
description = "Clipboard driven local code agent: reads edit blocks from a chat model and applies them safely"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyperclip>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tules = "tules.cli:main"

[tool.setuptools.packages.find]
include = ["tules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "C4", "RUF"]
ignore = ["W191", "E101"]

[tool.ruff.format]
indent-style = "tab"
